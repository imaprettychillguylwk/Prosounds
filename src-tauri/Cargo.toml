[package]
name = "prosounds"
version = "0.1.0"
description = "Prosounds"
authors = ["Freddy"]
edition = "2021"

[lib]
name = "prosounds_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
